services:
  redis:
    image: redis:latest
    container_name: mysolution-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
  #--Auth service--
  auth-api:
    build:
      context: .
      dockerfile: MySolution.Api/Dockerfile
    container_name: mysolution-auth-api
    ports:
      - "5182:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - RabbitMQ__Host=rabbitmq
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Port=5432;Database=mysolution_db;User Id=postgres;Password=${POSTGRES_PASSWORD};Search Path=mysolution
    depends_on:
      - redis
      - rabbitmq
  #--Email service api--
  email-api:
    build:
      context: .
      dockerfile: MySolution.Email.Api/Dockerfile
    container_name: mysolution-email-api
    ports:
      - "5183:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Redis__ConnectionString=redis:6379,abortConnect=false
      - RabbitMQ__Host=rabbitmq
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Port=5432;Database=mysolution_db;User Id=postgres;Password=${POSTGRES_PASSWORD};Search Path=mysolution
    depends_on:
      - redis
      - rabbitmq
volumes:
  redis_data:
  rabbitmq_data: