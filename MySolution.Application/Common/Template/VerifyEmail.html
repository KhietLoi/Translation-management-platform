<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
</head>

<body style="font-family: 'Segoe UI'; background:#f4f7f6;">

<table width="100%" cellpadding="0" cellspacing="0"
       style="max-width:600px;margin:auto;background:white;">

    <tr>
        <td style="background:#2563eb;padding:30px;text-align:center;">
            <h1 style="color:white;">Welcome to Our Platform!</h1>
        </td>
    </tr>

    <tr>
        <td style="padding:40px">

            <p>
                Hello <strong>{{ user_name }}</strong>,
            </p>

            <p>
                Thank you for registering.
            </p>

            <div style="text-align:center">

                <a href="{{ verify_url }}"
                   style="background:#2563eb;color:white;padding:14px 30px;text-decoration:none;">
                    Verify Email Address
                </a>

            </div>

            <p style="color:red">
                This link expires in {{ expiry_minutes }} minutes.
            </p>

        </td>
    </tr>

    <tr>
        <td style="text-align:center">

            <img src="{{ logo_url }}"
                 style="max-height:400px;width:800px;" />

            <p>
                © {{ year }} MySolution
            </p>

        </td>
    </tr>

</table>

</body>
</html>
